<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EV Charge Controller</title>
<style>
body{font-family:system-ui;background:#111;color:#eee;max-width:560px;margin:auto;padding:12px}
.card{background:#1d1d1d;border-radius:12px;padding:12px;margin:10px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{font-size:.8em;color:#aaa;display:block}input,select{width:100%;box-sizing:border-box;padding:6px;background:#222;color:#eee;border:1px solid #444;border-radius:6px}
.modes button{flex:1;padding:12px;border:0;border-radius:8px;background:#333;color:#eee;font-size:1em}.modes{display:flex;gap:6px}
.modes .on{background:#2e7d32}button.save{width:100%;padding:12px;margin-top:8px;border:0;border-radius:8px;background:#1565c0;color:#fff}
.big{font-size:1.4em}.err{color:#ff6b6b}
</style>
<h2>🚗 Tesla Laden</h2>
<div class="card" id="st"></div>
<div class="card"><div class="modes" id="modes"></div></div>
<div class="card"><div class="grid" id="form"></div><button class="save" onclick="save()">Speichern</button></div>
<script>
let S=null;
const F=[
["express_amps","Express: Ampere","number",["express"]],
["min_amps","Smart: Min A","number"],["max_amps","Smart: Max A","number"],
["grid_offset_w","Netz-Offset (W)","number"],["battery_min_soc","Hausbatterie Min-SoC %","number"],
["battery_max_discharge_w","Batterie-Entladung erlaubt (W)","number"],
["pause_below_min","Pause statt Netz bei Min","bool"],
["max_soc","Max Akkustand %","number"],["min_soc_tomorrow","Min Akkustand morgen %","number"],
["deadline","Bis Uhrzeit","time"],["start_delay_s","Startverzögerung s","number"],["stop_delay_s","Stoppverzögerung s","number"]];
function render(){
 const s=S.settings,t=S.state,d=S.decision;
 st.innerHTML=`<div class=big>${d.charge?'⚡ lädt '+d.amps+' A':'⏸ pausiert'}</div><div>${d.reason}</div>
 <div>Akku ${t.ev_soc??'?'}% · PV ${Math.round(t.pv_w)} W · Netz ${Math.round(t.grid_w)} W · Hausbatt. ${Math.round(t.battery_w)} W ${t.battery_soc??''}%</div>
 ${S.dry_run?'<div>(Testmodus)</div>':''}${S.error?'<div class=err>'+S.error+'</div>':''}`;
 modes.innerHTML=[["off","Aus"],["express","Express"],["smart","Intelligent"]].map(([k,n])=>`<button class="${s.mode==k?'on':''}" onclick="setMode('${k}')">${n}</button>`).join('');
 if(!form.dataset.done){form.dataset.done=1;form.innerHTML=F.map(([k,n,ty])=>
  `<div><label>${n}</label>${ty=='bool'?`<select id=f_${k}><option value=false>Nein</option><option value=true>Ja</option></select>`:`<input id=f_${k} type=${ty}>`}</div>`).join('');
  F.forEach(([k,,ty])=>document.getElementById('f_'+k).value=s[k]);}
}
async function load(){S=await (await fetch('api/status')).json();render()}
async function put(){
 const s={...S.settings};
 F.forEach(([k,,ty])=>{const v=document.getElementById('f_'+k).value;s[k]=ty=='number'?+v:ty=='bool'?v=='true':v});
 return s}
async function send(s){S=await (await fetch('api/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(s)})).json();render()}
async function save(){send(await put())}
async function setMode(m){send({...S.settings,mode:m})}
load();setInterval(load,5000);
</script></html>
